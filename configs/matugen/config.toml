[config]
version_check = false

[config.wallpaper]
set = false
command = "true"
arguments = []

# Quickshell - preserve your existing template
[templates.quickshell]
input_path = "/etc/nixos-config/configs/matugen/templates/colors.json"
output_path = "/home/keanbp/.config/quickshell/generated/colors.json"

# Kitty - InioX community template
[templates.kitty]
input_path = "/etc/nixos-config/configs/matugen/templates/kitty-colors.conf"
output_path = "/home/keanbp/.config/kitty/themes/Matugen.conf"
post_hook = "pkill -USR1 kitty || true"

# Mako - InioX community template
[templates.mako]
input_path = "/etc/nixos-config/configs/matugen/templates/mako"
output_path = "/home/keanbp/.config/mako/mako-colors"
post_hook = "makoctl reload"

# Btop - InioX community template
[templates.btop]
input_path = "/etc/nixos-config/configs/matugen/templates/btop.theme"
output_path = "/home/keanbp/.config/btop/themes/matugen.theme"
post_hook = "pkill -USR2 btop || true"

# Neovim - dynamic wallpaper colors
[templates.nvim]
input_path = "/etc/nixos-config/configs/matugen/templates/nvim.json"
output_path = "/home/keanbp/.config/nvim/matugen.json"

# Fastfetch - dynamic wallpaper colors
[templates.fastfetch]
input_path = "/etc/nixos-config/configs/matugen/templates/fastfetch.jsonc"
output_path = "/home/keanbp/.config/fastfetch/config.jsonc"

# Rofi - dynamic wallpaper colors
[templates.rofi]
input_path = "/etc/nixos-config/configs/matugen/templates/rofi-colors.rasi"
output_path = "/home/keanbp/.config/rofi/matugen-colors.rasi"

# MangoWC - dynamic compositor colors
[templates.mango]
input_path = "/etc/nixos-config/configs/matugen/templates/mango-colors.conf"
output_path = "/home/keanbp/.config/mango/matugen-colors.conf"

# Hyprland - dynamic Lua colors
[templates.hyprland]
input_path = "/etc/nixos-config/configs/matugen/templates/hyprland-colors.lua"
output_path = "/home/keanbp/.config/hypr/matugen-colors.lua"

# Hyprlock - dynamic wallpaper colors
[templates.hyprlock]
input_path = "/etc/nixos-config/configs/matugen/templates/hyprlock-colors.conf"
output_path = "/home/keanbp/.config/hypr/hyprlock-colors.conf"
