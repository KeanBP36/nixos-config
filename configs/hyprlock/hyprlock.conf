general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 2
    contrast = 1
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# =========================
# Password
# =========================

input-field {
    monitor =
    size = 240, 52
    outline_thickness = 2
    rounding = 12

    outer_color = rgba(255, 255, 255, 0.15)
    inner_color = rgba(31, 31, 31, 0.85)
    font_color = rgba(212, 212, 212, 1.0)

    # Keep all state colors consistent instead of colorful
    check_color = rgba(137, 180, 250, 1.0)
    fail_color = rgba(243, 139, 168, 1.0)
    capslock_color = rgba(255, 255, 255, 0.15)
    numlock_color = rgba(255, 255, 255, 0.15)
    bothlock_color = rgba(255, 255, 255, 0.15)

    dots_size = 0.30
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -2

    fade_on_empty = true
    placeholder_text = <i>Password</i>
    hide_input = false

    position = 0, -20
    halign = center
    valign = center
}

# =========================
# Clock
# =========================

label {
    monitor =
    text = $TIME
    color = rgba(212, 212, 212, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font

    position = 0, 85
    halign = center
    valign = center
    text_align = center
}

# =========================
# Date
# =========================

label {
    monitor =
    text = cmd[update:60000] date '+%A, %d %B'
    color = rgba(166, 173, 200, 0.85)
    font_size = 18
    font_family = JetBrainsMono Nerd Font

    position = 0, 30
    halign = center
    valign = center
    text_align = center
}
